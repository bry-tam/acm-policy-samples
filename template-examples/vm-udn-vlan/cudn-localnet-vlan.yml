---
object-templates-raw: |
  {{- range $cudn := (lookup "k8s.ovn.org/v1" "ClusterUserDefinedNetwork" "" "").items }}
    {{- if or (ne $cudn.spec.network.topology "Localnet") (eq (dig "annotations" "nodebridgename" "" $cudn.metadata) "") }}
      {{- continue }}
    {{- end }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: nmstate.io/v1
      kind: NodeNetworkConfigurationPolicy
      metadata:
        name: {{ $cudn.spec.network.localnet.physicalNetworkName }}
      spec:
        desiredState:
          ovn:
            bridge-mappings:
              - localnet: {{ $cudn.spec.network.localnet.physicalNetworkName }}
                bridge: {{ index $cudn.metadata.annotations "nodebridgename" }}
                state: up
        nodeSelector:
          node-role.kubernetes.io/worker: ""
  {{- end }}

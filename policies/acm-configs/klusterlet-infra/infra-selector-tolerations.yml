---
object-templates-raw: |
  {{/* ##  Gather all AddOnDeploymentConfig  to reference later ## */}}
  {{- $aodc := dict }}
  {{- range $ao := (lookup "addon.open-cluster-management.io/v1beta1" "AddOnDeploymentConfig" "" "").items }}
    {{- $_ := set $aodc (printf "%s-%s" $ao.metadata.namespace $ao.metadata.name) $ao }}
  {{- end }}

  {{/* ##  create the yaml to represent the nodeselector for the AddOnDeploymentConfig as a reusable bit ## */}}
  {{- $nodeSelector := `
    agentInstallNamespace: open-cluster-management-agent-addon
    nodePlacement:
      nodeSelector:
        node-role.kubernetes.io/%[1]s: ""
      tolerations:
      - key: node-role.kubernetes.io/%[1]s
        operator: Exists
  `}}

  {{/* ##  Gather all ManagedClusters using the ManagedClusterInfo object since this has node info ## */}}
  {{- range $mc := (lookup "internal.open-cluster-management.io/v1beta1" "ManagedClusterInfo" "" "").items }}

    {{/* ##  check if has infra nodes   ## */}}
    {{- $roleLabel := "worker" }}
    {{- range $nd := $mc.status.nodeList }}
      {{- if and (eq "" (dig "node-role.kubernetes.io/infra" "notinfra" $nd.labels)) (ne "" (dig "node-role.kubernetes.io/storage" "notstorage" $nd.labels)) }}
        {{- $roleLabel = "infra" }}
        {{- break }}
      {{- end }}
    {{- end }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        annotations:
          open-cluster-management/nodeSelector: '{"node-role.kubernetes.io/{{ $roleLabel }}":""}'
          open-cluster-management/tolerations: '[{"key":"node-role.kubernetes.io/{{ $roleLabel }}","operator":"Exists"}]'
        name: {{ $mc.metadata.name }}

    {{/* ##  Gather all ManagedClusterAddOn ## */}}
    {{- range $mca := (lookup "addon.open-cluster-management.io/v1alpha1" "ManagedClusterAddOn" $mc.metadata.name "").items }}
      {{- $aodcSpec := ((printf $nodeSelector $roleLabel) | fromYaml) }}
      {{- $aodcName := (dig "annotations" "org_addondeploymentconfig_name" "" $mca.metadata) }}

      {{/* ##  Check if there is an existing AddOnDeploymentConfig created for this MCAO ## */}}
      {{- range $configRef := $mca.status.configReferences }}
        {{- if eq $configRef.resource "addondeploymentconfigs" }}
          {{- if not $aodcName }}
            {{- $aodcName = (printf "%s-%s" $configRef.desiredConfig.namespace $configRef.desiredConfig.name) }}
          {{- end }}
          {{- $aodcSpec = merge $aodcSpec (get $aodc $aodcName).spec }}
          {{- break }}
        {{- end }}
      {{- end }}

  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: addon.open-cluster-management.io/v1alpha1
      kind: AddOnDeploymentConfig
      metadata:
        name: 'override-{{ $mca.metadata.name }}'
        namespace: {{ $mc.metadata.name }}
      spec: '{{ $aodcSpec | toRawJson | toLiteral }}'

  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: addon.open-cluster-management.io/v1beta1
      kind: ManagedClusterAddOn
      metadata:
        name: {{ $mca.metadata.name }}
        namespace: {{ $mc.metadata.name }}
        annotations:
          org_addondeploymentconfig_name: '{{ $aodcName }}'
      spec:
        configs:
          - group: addon.open-cluster-management.io
            name: 'override-{{ $mca.metadata.name }}'
            namespace: {{ $mc.metadata.name }}
            resource: addondeploymentconfigs

    {{- end }}
  {{- end }}

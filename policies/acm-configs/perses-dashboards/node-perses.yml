            description: "Number of PLEG relists performed in the selected interval, per node. The kubelet normally relists about once per second; a low count (below 150 is a warning, below 50 is critical) means the kubelet is stuck or heavily delayed."
            name: PLEG Relist Count in 5 mins, <150 Warning, <50 Critical
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(increase(kubelet_pleg_relist_duration_seconds_count{cluster="$cluster",node=~"$node"}[$interval])) by (node)
                  seriesNameFormat: '{{node}}'

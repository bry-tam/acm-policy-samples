---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: node-performance
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: bry-tam / Node Performance
      description: "Per-node performance of the cluster's workers and control plane nodes: CPU, load, memory, disk IOPS, cgroup resource use, workload distribution, top containers, kubelet and CRI-O health, PLEG latency, inode usage and (when enabled) pressure stall information (PSI). Use the role and node variables to restrict every panel to specific node roles or individual nodes (default: all). Warning/critical thresholds in panel titles are rules of thumb from the upstream Red Hat performance dashboards. Panels on PSI need PSI enabled on the nodes and otherwise show 'No data'."
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        sort: alphabetical-asc
        display:
          hidden: false
          name: role
        name: role
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: role
            matchers:
            - kube_node_role{cluster="$cluster"}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        defaultValue:
        - $__all
        sort: alphabetical-asc
        display:
          hidden: false
          name: node
        name: node
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role=~"$role"}
    - kind: ListVariable
      spec:
        display:
          name: interval
          hidden: false
        defaultValue: 10m
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 3m
            - 5m
            - 10m
            - 20m
            - 30m
        name: interval
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            description: "CPU used on each worker node as a percentage of one core (100% = one full core; a 4-core node can show up to 400%). Idle time is excluded. Use it to find busy or unevenly loaded workers."
            name: Workers CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_1':
        kind: Panel
        spec:
          display:
            description: "CPU used on each control plane node as a percentage of one core (100% = one full core). Control plane nodes run the API server and etcd, so sustained high CPU here affects the whole cluster."
            name: Control Plane CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_2':
        kind: Panel
        spec:
          display:
            description: "1-minute load average per worker node. Load consistently above the node's CPU core count means processes are waiting for CPU (or blocked on disk I/O)."
            name: Workers Load1
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: 'node_load1{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") '
                  seriesNameFormat: '{{instance}}'
      '0_3':
        kind: Panel
        spec:
          display:
            description: "1-minute load average per control plane node. Load consistently above the node's core count signals CPU or I/O saturation."
            name: Control Plane Load1
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: 'node_load1{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") '
                  seriesNameFormat: '{{instance}}'
      '0_4':
        kind: Panel
        spec:
          display:
            description: "Memory available for new workloads on each worker (MemAvailable), plus the total across the selected workers. Low or shrinking values mean the node is close to memory pressure and evictions."
            name: Workers Memory Available
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)")
                  seriesNameFormat: '{{instance}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )
                  seriesNameFormat: sum
      '0_5':
        kind: Panel
        spec:
          display:
            description: "Memory available on each control plane node (MemAvailable), plus the total across the selected nodes. Low values risk OOM kills of critical components such as etcd and the API server."
            name: Control Plane Memory Available
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)")
                  seriesNameFormat: '{{instance}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )
                  seriesNameFormat: sum
      '0_6':
        kind: Panel
        spec:
          display:
            description: "Disk read and write operations per second for each device on each worker. High IOPS can saturate a disk; compare against what the underlying storage supports."
            name: Workers Disk IOPS
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_reads_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - read'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_writes_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - write'
      '0_7':
        kind: Panel
        spec:
          display:
            description: "Disk read and write operations per second for each device on each control plane node. etcd is very sensitive to disk latency, so heavy IOPS on the etcd disk deserves attention."
            name: Control Plane Disk IOPS
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_reads_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - read'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_writes_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - write'
      "0_8":
        kind: Panel
        spec:
          display:
            description: "Total number of container threads (processes/threads) running on each worker node. A very high or steadily growing value can indicate a thread leak or approaching the node's PID limits."
            name: Workers Container Threads
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (container_threads{cluster="$cluster", container!=""})  * on (node) group_left kube_node_role{cluster="$cluster", role = "worker", node=~"$node"}
                  seriesNameFormat: '{{node}}'
      "0_9":
        kind: Panel
        spec:
          display:
            description: "Total number of container threads running on each control plane node. Steady growth can indicate a leak in a control plane component."
            name: Control Plane Container Threads
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (container_threads{cluster="$cluster", container!=""})  * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"}
                  seriesNameFormat: '{{node}}'
      '1_0':
        kind: Panel
        spec:
          display:
            description: "CPU used by key systemd/kubernetes cgroups (system.slice, kubelet, CRI-O, OVS, journald, kubepods, ...) on the selected worker nodes, as a percentage of one core, summed across those nodes. Shows how much CPU goes to system services versus pods. Requires the cgroup-id metrics in node-metrics-scrapeconfig.yml."
            name: Workers CGroup CPU(% of 1 core)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (( rate(container_cpu_usage_seconds_total{cluster="$cluster",node=~"$node", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"}[$interval])) * 100 * on (node) group_left kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} )
                  seriesNameFormat: '{{id}}'
      '1_1':
        kind: Panel
        spec:
          display:
            description: "CPU used by key systemd/kubernetes cgroups (system.slice, kubelet, CRI-O, OVS, journald, kubepods, ...) on the selected control plane nodes, as a percentage of one core, summed across those nodes."
            name: Control Plane CGroup CPU(% of 1 core)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (( rate(container_cpu_usage_seconds_total{cluster="$cluster",node=~"$node", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"}[$interval])) * 100 * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} )
                  seriesNameFormat: '{{id}}'
      '1_2':
        kind: Panel
        spec:
          display:
            description: "Working-set memory of key systemd/kubernetes cgroups on the selected worker nodes, summed across those nodes. Shows how much memory goes to system services versus pods. Requires the cgroup-id metrics in node-metrics-scrapeconfig.yml."
            name: Workers CGroup Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (container_memory_working_set_bytes{cluster="$cluster",node=~"$node", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"} * on (node) group_left kube_node_role{cluster="$cluster", role = "worker", node=~"$node"} )
                  seriesNameFormat: '{{id}}'
      '1_3':
        kind: Panel
        spec:
          display:
            description: "Working-set memory of key systemd/kubernetes cgroups on the selected control plane nodes, summed across those nodes."
            name: Control Plane CGroup Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (container_memory_working_set_bytes{cluster="$cluster",node=~"$node", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"} * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane", node=~"$node"} )
                  seriesNameFormat: '{{id}}'
      '1_4':
        kind: Panel
        spec:
          display:
            description: "Working-set memory used by the system.slice cgroup (host OS services such as kubelet and CRI-O) on each node. Unexpected growth indicates a leak or runaway system service. Requires the cgroup-id metrics in node-metrics-scrapeconfig.yml."
            name: system.slice Working Set by node
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node)(container_memory_working_set_bytes{cluster="$cluster",node=~"$node",id="/system.slice"})
                  seriesNameFormat: system.slice - {{ node }}
      '1_5':
        kind: Panel
        spec:
          display:
            description: "CPU used by the system.slice cgroup (host OS services) on each node, as a percentage of one core. High values mean system services (kubelet, CRI-O, journald, ...) are consuming CPU that pods could use."
            name: system.slice CPU by node
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (( rate(container_cpu_usage_seconds_total{cluster="$cluster",node=~"$node",id="/system.slice"}[$interval])) * 100)
                  seriesNameFormat: system.slice - {{ node }}
      '2_0':
        kind: Panel
        spec:
          display:
            description: "Number of pods by phase (Running, Pending, Failed, Succeeded, Unknown) for the whole cluster. Not filtered by the role/node variables because pods that are pending are not yet assigned to a node. Growing Pending or Failed counts indicate scheduling or runtime problems."
            name: Pod count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(kube_pod_status_phase{cluster="$cluster"}) by (phase)
                  seriesNameFormat: '{{phase}} pods'
      '2_1':
        kind: Panel
        spec:
          display:
            description: "Number of pods on each node. Use it to check that pods are spread reasonably across nodes and to see nodes approaching the maximum pods-per-node limit (250 by default on OpenShift)."
            name: Pod Distribution
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_pod_info{cluster="$cluster",node=~"$node"}) by (node)
                  seriesNameFormat: '{{ node }}'
      '2_2':
        kind: Panel
        spec:
          display:
            description: "Total number of containers running in the pods on the selected nodes."
            name: Container count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_pod_container_info{cluster="$cluster"} * on (namespace, pod) group_left (node) kube_pod_info{cluster="$cluster",node=~"$node"})
                  seriesNameFormat: Containers
      '2_3':
        kind: Panel
        spec:
          display:
            description: "Number of containers on each node, as seen by the kubelet's cAdvisor. Compare with the pod distribution to spot nodes with heavy multi-container pods."
            name: Container Distribution
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(container_last_seen{cluster="$cluster",node=~"$node"}) by (node)
                  seriesNameFormat: Containers on {{node}}
      '3_0':
        kind: Panel
        spec:
          display:
            description: "The 10 containers with the largest working-set memory on the selected nodes. Working set is the memory the kernel cannot easily reclaim and what the OOM killer considers. Use it to find the heaviest memory consumers."
            name: Top 10 Container Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max

                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(workqueue_queue_duration_seconds_bucket{cluster="$cluster",job=~"ovnkube-controller.*"}[$interval])) by (pod, name, le))
                  seriesNameFormat: '{{pod}} - {{name}}'
      '3_3':
        kind: Panel
        spec:
          display:
            description: "Seconds of work in progress that has not yet finished, per work queue. Large values can indicate stuck workers."

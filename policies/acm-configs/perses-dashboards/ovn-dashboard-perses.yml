                  seriesNameFormat: '{{pod}} - {{name}}'
      '3_2':
        kind: Panel
        spec:
          display:
            description: "99th percentile time items wait in a work queue before being processed. Rising values mean the controller is falling behind."
            name: OVNKube Controller workqueue duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:

      '3_0':
        kind: Panel
        spec:
          display:
            description: "Rate at which items are added to each ovnkube-controller work queue. Shows the volume of events the controller has to process, per queue name."
            name: OVNKube Controller workqueue
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(workqueue_adds_total{cluster="$cluster",job=~"ovnkube-controller.*"}[$interval])) by (pod, name)
                  seriesNameFormat: '{{pod}} - {{name}}'
      '3_1':
        kind: Panel
        spec:
          display:
            description: "Current number of items waiting in each ovnkube-controller work queue. A depth that stays high means the controller cannot keep up."
            name: OVNKube Controller workqueue Depth
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max

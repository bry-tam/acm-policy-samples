---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: ovn-dashboard
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: bry-tam / Openshift Networking
      description: "Health and performance of OVN-Kubernetes, the default OpenShift cluster network: leader and component status, a breakdown of where pod network startup time is spent (P99 latencies), CPU/memory of each OVN component (top 10 pods) and ovnkube-controller work queues. Use it when pods are slow to get networking, or to check networking control plane load. Panels show 'No data' on clusters that do not use OVN-Kubernetes."
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        display:
          name: Master
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role="master"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _master_node
    - kind: ListVariable
      spec:
        display:
          name: Worker
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role=~"work.*"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _worker_node
    - kind: ListVariable
      spec:
        display:
          name: OVNKube-Controlplane
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
            - '{cluster="$cluster",pod=~"ovnkube-control-plane.*", namespace=~"openshift-ovn-kubernetes"}'
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: controlplane_pod
    - kind: ListVariable
      spec:
        display:
          name: OVNKube-Node
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
            - '{cluster="$cluster",pod=~"ovnkube-node.*", namespace=~"openshift-ovn-kubernetes"}'
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: kubenode_pod
    - kind: ListVariable
      spec:
        display:
          name: interval
          hidden: false
        defaultValue: 10m
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 3m
            - 5m
            - 10m
            - 20m
            - 30m
        name: interval
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            description: "Pod that currently holds the ovnkube cluster-manager leader lease. Exactly one pod should be listed; none, or a leader that changes often, indicates control plane trouble."
            name: OVNKube Cluster Manager Leader
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              metricLabel: pod
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#ff9830'
                  value: 0
                - color: '#73bf69'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: ovnkube_clustermanager_leader{cluster="$cluster"} > 0
                  seriesNameFormat: '{{pod}}'
      '0_1':
        kind: Panel
        spec:
          display:
            description: "Status of ovn-northd per pod (1 = active, 0 = standby/paused). In a healthy HA setup one northd is active at a time."
            name: OVN Northd Status
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              metricLabel: pod
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#ff9830'
                  value: 0
                - color: '#73bf69'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: ovn_northd_status{cluster="$cluster"}
                  seriesNameFormat: '{{pod}}'
      '0_2':
        kind: Panel
        spec:
          display:
            description: "Number of ovn-controller instances reporting (normally one per node). A drop means a node's OVN controller is down or not being scraped."
            name: OVN Controller Count
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(ovn_controller_monitor_all{cluster="$cluster"}) by (namespace)
                  seriesNameFormat: ''
      '0_3':
        kind: Panel
        spec:
          display:
            description: "CPU used by the OVN-Kubernetes control plane pods (ovnkube-control-plane / ovnkube-master), as a percentage of one core, per pod and node."
            name: OVNKube Control Plane CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( irate(container_cpu_usage_seconds_total{cluster="$cluster",pod=~"(ovnkube-master|ovnkube-control-plane).+",namespace="openshift-ovn-kubernetes",container!~"POD|"}[$interval])*100 ) by (pod, node)
                  seriesNameFormat: '{{pod}} - {{node}}'
      '0_4':
        kind: Panel
        spec:
          display:
            description: "Resident memory (RSS) of the OVN-Kubernetes control plane pods, per pod and node."
            name: OVNKube Control Plane Memory Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: container_memory_rss{cluster="$cluster",pod=~"(ovnkube-master|ovnkube-control-plane).+",namespace="openshift-ovn-kubernetes",container!~"POD|"}
                  seriesNameFormat: '{{pod}} - {{node}}'
      '1_0':
        kind: Panel
        spec:
          display:
            description: "99th percentile time for the Kubernetes scheduler to schedule a pod. First stage of pod startup; shown for context before the network stages."
            name: Scheduler Pod Scheduling Duration (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{cluster="$cluster"}[$interval])) > 0
                  seriesNameFormat: '{{pod}}'
      '1_1':
        kind: Panel
        spec:
          display:
            description: "99th percentile time between ovnkube first seeing a pod and creating its logical switch port (LSP) in the OVN northbound database. High values mean the OVN control plane is slow to react to new pods."
            name: Pod First Seen to LSP Created Latency (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_pod_first_seen_lsp_created_duration_seconds_bucket{cluster="$cluster"}[$interval])) by (pod, le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_2':
        kind: Panel
        spec:
          display:
            description: "99th percentile time to create the pod's network annotation (IP/MAC assignment) in ovnkube. Slow annotation delays pod networking."
            name: Pod Annotation Latency (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum by (pod, le) (rate(ovnkube_controller_pod_creation_latency_seconds_bucket{cluster="$cluster"}[$interval]))) > 0
                  seriesNameFormat: '{{pod}}'
      '1_3':
        kind: Panel
        spec:
          display:
            description: "99th percentile time from logical switch port creation until the port is bound in the southbound database. Measures ovn-northd processing delay."
            name: Port Binding After LSP Creation Latency (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_pod_lsp_created_port_binding_duration_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_4':
        kind: Panel
        spec:
          display:
            description: "99th percentile time from port binding until the port is assigned to a chassis (node). Measures how long OVN takes to place the pod's port on the node."
            name: Port Binding to Chassis Assignment Latency (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_port_binding_chassis_assignment_latency_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_5':
        kind: Panel
        spec:
          display:
            description: "99th percentile time until OVN marks the pod's port as up. This is the point where the pod's network plumbing is complete."
            name: Port Marked As Up (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_port_binding_port_up_duration_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_6':
        kind: Panel
        spec:
          display:
            description: "99th percentile time for the node's CNI plugin to handle a pod ADD request (setting up the pod's network interface). A major part of overall pod startup time."
            name: CNI Request ADD Latency (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_node_cni_request_duration_seconds_bucket{cluster="$cluster",command="ADD"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_7':
        kind: Panel
        spec:
          display:
            description: "99th percentile time for network configuration changes (such as services or policies) to be fully programmed on nodes. High values mean policies or services take long to take effect."
            name: Network Programming Complete (P99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_network_programming_duration_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_8':
        kind: Panel
        spec:
          display:
            description: "99th percentile time ovnkube takes to sync a Kubernetes service into OVN load balancers. Slow service syncs delay new services and endpoint updates."
            name: Sync Service Latency
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_controller_sync_service_latency_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '1_9':
        kind: Panel
        spec:
          display:
            description: "99th percentile time for an ovnkube node to become ready after it starts. Long values slow node recovery after reboots."
            name: OVNKube Node Ready Latency
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(ovnkube_node_ready_duration_seconds_bucket{cluster="$cluster"}[$interval])) by (pod,le)) > 0
                  seriesNameFormat: '{{pod}}'
      '2_0':
        kind: Panel
        spec:
          display:
            description: "CPU used by the ovnkube-node pods (top 10), as a percentage of one core. Highlights nodes with unusually busy network agents."
            name: OVNKube Node Pods CPU Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",pod=~"ovnkube-node.+",namespace="openshift-ovn-kubernetes",container!~"POD|"}[$interval])*100) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_1':
        kind: Panel
        spec:
          display:
            description: "Resident memory of the ovnkube-node pods (top 10). Use it to spot memory growth or leaks on specific nodes."
            name: OVNKube Node Pods Memory Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(container_memory_rss{cluster="$cluster",pod=~"ovnkube-node.+",namespace="openshift-ovn-kubernetes",container!~"POD|"}) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_2':
        kind: Panel
        spec:
          display:
            description: "CPU used by the northd container (top 10 pods). Northd translates the northbound database into logical flows; high CPU can slow network programming."
            name: Northd CPU Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",container="northd",namespace="openshift-ovn-kubernetes"}[$interval])*100) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_3':
        kind: Panel
        spec:
          display:
            description: "Resident memory of the northd container (top 10 pods)."
            name: Northd Memory Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(container_memory_rss{cluster="$cluster",container="northd",namespace="openshift-ovn-kubernetes"}) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_4':
        kind: Panel
        spec:
          display:
            description: "CPU used by the southbound database (sbdb) container (top 10 pods). The sbdb is contacted by every node's ovn-controller, so CPU grows with cluster size."
            name: Sbdb CPU Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",container="sbdb",namespace="openshift-ovn-kubernetes"}[$interval])*100) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_5':
        kind: Panel
        spec:
          display:
            description: "Resident memory of the southbound database (sbdb) container (top 10 pods). Grows with the number of nodes, ports and flows."
            name: Sbdb Memory Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(container_memory_rss{cluster="$cluster",container="sbdb",namespace="openshift-ovn-kubernetes"}) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_6':
        kind: Panel
        spec:
          display:
            description: "CPU used by the northbound database (nbdb) container (top 10 pods). The nbdb stores the logical network configuration written by ovnkube."
            name: Nbdb CPU Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",container="nbdb",namespace="openshift-ovn-kubernetes"}[$interval])*100) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_7':
        kind: Panel
        spec:
          display:
            description: "Resident memory of the northbound database (nbdb) container (top 10 pods)."
            name: Nbdb Memory Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(container_memory_rss{cluster="$cluster",container="nbdb",namespace="openshift-ovn-kubernetes"}) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
      '2_8':
        kind: Panel
        spec:
          display:
            description: "CPU used by the ovnkube-controller container (top 10 pods). It watches Kubernetes objects and translates them into OVN configuration."
            name: OVNKube Controller CPU Usage (Top 10)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",container="ovnkube-controller",namespace="openshift-ovn-kubernetes"}[$interval])*100) by (pod, node))
                  seriesNameFormat: '{{pod}} - {{node}}'
